              <h1 id="how-does-the-build-start">How does the build start?</h1>
<p>The process starts in <code>MarkdownNavigator.Console/Program.cs</code>.</p>
<p>It builds a host, registers the required services, resolves <code>ConsoleCommandService</code>, and then calls <code>RunAsync()</code>.</p>
<p>The console service performs the initial refresh and starts the file watcher.</p>
